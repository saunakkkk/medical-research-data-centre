name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: {}

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile Compact Contract
        working-directory: contract
        run: npm run compact

      - name: Run Contract Unit Tests
        working-directory: contract
        run: npm run test

      - name: Build Contract Package
        working-directory: contract
        run: npm run build

      - name: Build API Package
        working-directory: api
        run: npm run build

      - name: Build CLI Package
        working-directory: bboard-cli
        run: npm run build

      - name: Type-check and Build Frontend UI
        working-directory: bboard-ui
        run: npm run build
